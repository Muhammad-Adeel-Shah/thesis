# ===========================================================================
# Decoder-Bank Probing (DBP) -- bank registry
# ===========================================================================
# Every `revision` is a commit SHA resolved against the Hugging Face Hub during
# P0 (2026-09-19) and pinned here. Never load a bank member from a floating ref:
# an upstream re-upload would silently change the decoder fingerprint that the
# whole method is built on.
#
# `dtype_policy: fp32_default` means: run in fp32. fp16 is permitted for a member
# only once the P0 smoke test has recorded fp16_allowed=true for it, i.e.
# PSNR(recon_fp32, recon_fp16) >= 45 dB with no NaN/Inf (guardrail D-003).
#
# `crop_multiple` follows the kind: 8 for vae_kl / vae_kl_flux2 / vae_kl_5d / vq,
# 32 for vae_dc, 4 for sr_gan. Images are ALWAYS centre-cropped to a multiple,
# NEVER resized (D-001).
#
# `alias_of` marks a member whose decoder weights are byte-identical to another
# member's (P0 measured sd_ft_mse == sd21). Aliases are listed so the registry stays
# a faithful record of what exists upstream, but they are skipped by
# BankConfig.distinct_members() and therefore never reconstructed twice (D-016).
#
# `resolved_on` below is the P0 resolution date for the first ten members. The three
# members added in P1-B3 carry their own resolution date in `notes`.
# ===========================================================================

