# ===========================================================================
# DBP P5 -- the video decoder bank (docs/P5_PLAN.md section 2; approved 2026-11-21)
# ===========================================================================
# Every `revision` is the full commit SHA returned by HfApi.model_info on 2026-11-20
# (scripts/p5_hub_audit.py -> reports/p5_plan/p5_hub_audit.json). `vae_sha256` is the
# LFS sha256 of `<subfolder>/<vae_file>` at that revision: the identity of the decoder
# weights, checked again by scripts/p0_verify_pins.py --video-bank before data is written.
#
# Roles:
#   bank     -- trained on (the five video lineages + the image lineage per frame)
#   reserve  -- never trained on; unseen-VAE reconstruction tests (V1-c)
#   excluded -- recorded with the reason, never loaded
#
# The clip protocol (approval A5): 25 consecutive native frames (25 = 4*6+1 = 6*4+1 =
# 8*3+1 fits every temporal factor), centre crop 320, no resize, no temporal
# resampling; fp32 unless the smoke records fp16_build_allowed. No spatial tiling and no
# frame-wise (temporal-tiled) encode/decode: the loader switches both off and asserts it.
# ===========================================================================

